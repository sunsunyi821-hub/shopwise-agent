[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "shopwise-backend"
version = "0.1.0"
description = "ShopWise shopping decision agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "sqlmodel>=0.0.48,<0.1",
    "langgraph>=1.2,<2",
    "langchain-core>=1.4.7,<2",
    "anthropic>=2.3,<3",
    "openai>=3.41,<4",
    "sse-starlette>=3.0,<4",
    "python-dotenv>=1.1,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 is disabled because the learning notes in this repo use long Chinese comments.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# These files keep explanatory Chinese comments between imports for learning.
"app/main.py" = ["I001"]
"app/db.py" = ["I001"]
"app/schemas.py" = ["I001"]
